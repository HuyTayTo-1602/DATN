# =============================================================================
# docker-compose.yml
# Mục đích: Định nghĩa và quản lý tất cả services của hệ thống trong một file.
# Khởi chạy toàn bộ hệ thống: docker-compose up -d
# Dừng: docker-compose down
# Xem log: docker-compose logs -f backend
# =============================================================================

version: "3.9"

services:
  # --- Cơ sở dữ liệu PostgreSQL ---
  postgres:
    image: postgres:16-alpine       # Dùng alpine để giảm kích thước image
    container_name: job_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_recruitment
    volumes:
      # Lưu dữ liệu DB ra ngoài container để không mất khi restart
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"                 # Expose ra ngoài để dùng tool quản lý DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MinIO Object Storage (CV files) ---
  minio:
    image: minio/minio:latest
    container_name: job_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # API / SDK
      - "9001:9001"    # Web console: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend FastAPI ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/job_recruitment
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"
      MINIO_ENDPOINT: minio:9000          # backend → MinIO qua Docker network
      MINIO_PUBLIC_ENDPOINT: localhost:9000 # browser → MinIO qua host port mapping
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: cv-files
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"                 # Swagger UI: http://localhost:8000/docs
    volumes:
      # Mount mã nguồn để code thay đổi được phản ánh ngay (development)
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Frontend React (Vite dev server) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_frontend
    environment:
      # Proxy trong Vite sẽ forward /api → backend container qua Docker network
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"                 # Giao diện chính: http://localhost:5173
    volumes:
      - ./frontend:/app
      # Giữ nguyên node_modules trong container, không bị ghi đè bởi host mount
      - /app/node_modules
    depends_on:
      - backend

# Định nghĩa named volume để lưu dữ liệu DB
volumes:
  postgres_data:
  minio_data:
